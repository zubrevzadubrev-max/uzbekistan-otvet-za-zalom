<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Узбекистан вслух</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#19162c;color:#fff7ed;font:20px "Segoe UI",Arial,sans-serif}header,main,footer{width:min(92%,1620px);margin:auto}header,footer,.actions,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}header{min-height:84px;border-bottom:1px solid #555065}header strong{font-size:clamp(20px,2vw,34px)}.logo{color:#ffab89;margin-right:10px}button{font:inherit;font-weight:700;cursor:pointer;border:1px solid #827989;color:inherit;background:transparent;border-radius:100px;padding:.65em 1.1em}button:focus-visible{outline:4px solid #ffe095;outline-offset:4px}button:hover{border-color:white}.primary{background:#ffb191;color:#211928;border:0}.primary:hover{background:#ffccae}main{padding:clamp(20px,4vh,54px) 0}.layout{display:grid;grid-template-columns:1.65fr 1fr;gap:4vw;align-items:stretch}.panel{align-self:center}.eyebrow{color:#fbb89d;font-weight:750;letter-spacing:.13em;text-transform:uppercase;font-size:clamp(16px,1.4vw,25px)}h1{font-size:clamp(50px,7.4vw,135px);line-height:.99;letter-spacing:-.055em;margin:.3em 0}h1 em{font:italic 1.06em Georgia,serif;color:#ffb191}h2{font-size:clamp(32px,min(4.3vw,7.5vh),83px);line-height:1.1;letter-spacing:-.035em;margin:.45em 0}.lead,.answer{font-size:clamp(23px,2.2vw,42px);line-height:1.3}.lead{max-width:28em;color:#e3dce4}.answer{border-left:5px solid #ffb191;background:#31283e;padding:.6em .85em;margin:1em 0}.answer b{display:block;color:#ffbc9f;font-size:.75em;margin-bottom:.2em}.actions{justify-content:flex-start;margin-top:1.3em;font-size:clamp(22px,2vw,34px)}figure{margin:0;position:relative;min-height:min(61vh,670px);border-radius:48% 48% 12px 12px;overflow:hidden;background:#39334c}figure img{position:absolute;width:100%;height:100%;object-fit:cover}footer{border-top:1px solid #555065;padding:18px 0;color:#ddd3e2}.track{display:flex;gap:6px}.track i{height:6px;width:clamp(18px,3vw,48px);background:#575064;border-radius:4px}.track .on{background:#ffb191}dialog{color:inherit;background:#2b243a;border:1px solid #706377;border-radius:22px;width:min(94%,460px);padding:28px}dialog::backdrop{background:#110c20ca}dialog button{width:100%;margin-top:12px}dialog label{margin:16px 0;display:flex;justify-content:space-between}input{width:23px;height:23px;accent-color:#fdac88}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:2}figure{min-height:145px;height:22vh;border-radius:90px 12px 12px 12px}.layout.play figure{display:none}header{min-height:68px}footer{font-size:16px}button{font-size:inherit}}
</style></head><body><header><strong><span class="logo">✳</span>Узбекистан вслух</strong><button id="pause">Ⅱ　Пауза</button></header><main id="stage"></main><footer><span id="status"></span><span class="track" id="track" aria-hidden="true"></span></footer>
<dialog id="menu"><h2>Пауза</h2><label>Спокойная музыка<input id="music" type="checkbox" checked></label><button id="screen">На весь экран</button><button id="resume" class="primary">Продолжить</button></dialog><script src="game.js"></script></body></html>
